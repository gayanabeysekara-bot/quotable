[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zoneguard-edge"
version = "0.1.0"
description = "ZoneGuard AI on-premises edge agent: local RTSP processing, metadata-only cloud sync"
requires-python = ">=3.11"
dependencies = ["zoneguard-vision", "httpx>=0.27", "psutil>=5.9"]

[project.scripts]
zoneguard-edge = "zoneguard_edge.__main__:main"

[tool.setuptools.packages.find]
include = ["zoneguard_edge*"]
